<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harmonograph v0.5</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f0e7;color:#292824;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:820px;margin:auto;padding:28px 18px 60px}h1{font-size:42px;margin:0 0 12px}.sub{font-size:20px}.wrap{background:#fff;border:1px solid #d8d1c4;border-radius:22px;overflow:hidden}canvas{display:block;width:100%;aspect-ratio:1}.controls,.speeds{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}button{border:0;border-radius:14px;padding:15px 18px;font-size:19px;font-weight:700;background:#2c2b27;color:#fff}.secondary{background:#858178}.status{font-size:19px;font-weight:700}.card{background:#fffdf8;border:1px solid #d8d1c4;border-radius:22px;padding:20px;margin:16px 0}.card h2{font-size:28px;margin:0 0 14px}label{display:block;font-size:18px;font-weight:650;margin:12px 0 6px}input,select{width:100%;font:inherit;font-size:20px;padding:13px;border:1px solid #cbc4b8;border-radius:12px;background:#fff}.tech{color:#777269}@media print{body{background:#fff}main>*{display:none!important}main,.wrap{display:block!important;margin:0!important;padding:0!important;max-width:none!important}.wrap{border:0!important;border-radius:0!important}canvas{width:100%!important}@page{size:A4 portrait;margin:15mm}}</style></head>
<body><main><h1>Harmonograph Simulator v0.5</h1><p class="sub">Physical controls first. Technical meaning underneath.</p><div class="wrap"><canvas id="cv" width="900" height="900"></canvas></div>
<div class="controls"><button id="start">Start</button><button id="pause" class="secondary">Pause</button><button id="reset" class="secondary">Reset</button><button id="print" class="secondary">Print / Save Drawing</button></div>
<div class="status">Elapsed: <span id="elapsed">0.0</span> s &nbsp; Time advance: <span id="speedLabel">4×</span></div><div class="speeds"><button data-sp="1">1×</button><button data-sp="4">4×</button><button data-sp="16">16×</button><button data-sp="64">64×</button></div><div id="cards"></div>
<p class="tech">Model: exponentially damped harmonic motion. “Decay time” is the plain-language control name for the damping time constant. Inputs lock during a run.</p></main>
<script>
const cv=document.getElementById('cv'),g=cv.getContext('2d'),cards=document.getElementById('cards');
let S=[{title:'A — Horizontal',f:.5,a:100,d:65,delay:0,rot:0},{title:'B — Vertical',f:.5,a:100,d:65,delay:.125,rot:0},{title:'C — Rotary',f:.625,a:0,d:65,dir:1,rot:1}];
let running=false,paused=false,finished=false,t=0,last=null,speed=4,raf;
function build(){cards.innerHTML='';S.forEach((p,i)=>{let e=document.createElement('div');e.className='card';e.innerHTML=`<h2>${p.title}</h2><label>Swing speed (Hz)</label><input data-i="${i}" data-k="f" type="number" step=".001" value="${p.f}"><label>Pull / amplitude</label><input data-i="${i}" data-k="a" type="number" value="${p.a}"><label>Decay time (s)</label><input data-i="${i}" data-k="d" type="number" value="${p.d}">${p.rot?`<label>Rotation</label><select data-i="${i}" data-k="dir"><option value="1">Clockwise</option><option value="-1">Counter-clockwise</option></select>`:`<label>Release timing</label><select data-i="${i}" data-k="delay"><option value="0"${p.delay===0?' selected':''}>Release first</option><option value=".125"${p.delay===.125?' selected':''}>⅛ cycle later (45°)</option><option value=".25">¼ cycle later (90°)</option><option value=".5">½ cycle later (180°)</option><option value=".75">¾ cycle later (270°)</option></select>`}`;cards.appendChild(e)});cards.querySelectorAll('input,select').forEach(e=>e.oninput=()=>{S[+e.dataset.i][e.dataset.k]=+e.value;drawBase()})}
function lock(v){cards.querySelectorAll('input,select').forEach(e=>e.disabled=v)}
function drawBase(){g.fillStyle='#fff';g.fillRect(0,0,900,900);g.strokeStyle='#eee';g.lineWidth=1;g.beginPath();g.moveTo(450,0);g.lineTo(450,900);g.moveTo(0,450);g.lineTo(900,450);g.stroke()}
function pos(q){let x=0,y=0,A=S[0],B=S[1],C=S[2],amp=(p,z)=>p.a*Math.exp(-z/Math.max(.001,p.d)),ta=q-A.delay/A.f,tb=q-B.delay/B.f;if(ta>=0)x+=amp(A,ta)*Math.cos(2*Math.PI*A.f*ta);if(tb>=0)y+=amp(B,tb)*Math.cos(2*Math.PI*B.f*tb);if(C.a){let a=amp(C,q);x+=a*Math.cos(2*Math.PI*C.f*q);y+=(C.dir||1)*a*Math.sin(2*Math.PI*C.f*q)}return[450+x*3.05,450+y*3.05]}
function render(showPen=true){drawBase();g.strokeStyle='#333';g.lineWidth=1.35;g.beginPath();let p=pos(0);g.moveTo(...p);for(let q=.01;q<=t;q+=.01)g.lineTo(...pos(q));g.stroke();if(showPen&&running&&!finished){p=pos(t);g.fillStyle='#24b34b';g.beginPath();g.arc(p[0],p[1],4,0,Math.PI*2);g.fill()}elapsed.textContent=t.toFixed(1)}
function loop(ts){if(!running||paused)return;if(last===null)last=ts;t+=(ts-last)/1000*speed;last=ts;if(t>=180){t=180;running=false;finished=true;lock(false);render(false);return}render(true);raf=requestAnimationFrame(loop)}
start.onclick=()=>{if(finished){t=0;finished=false}running=true;paused=false;pause.textContent='Pause';last=null;lock(true);raf=requestAnimationFrame(loop)}
pause.onclick=()=>{if(!running)return;paused=!paused;pause.textContent=paused?'Continue':'Pause';render(true);if(!paused){last=null;raf=requestAnimationFrame(loop)}}
reset.onclick=()=>{cancelAnimationFrame(raf);running=paused=finished=false;t=0;last=null;lock(false);pause.textContent='Pause';render(false)}
document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{speed=+b.dataset.sp;speedLabel.textContent=speed+'×'})
print.onclick=()=>{render(false);window.print();if(running)render(true)}
build();render(false);
</script></body></html>
